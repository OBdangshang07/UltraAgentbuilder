name: Offline source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check public source boundary
        run: npm run check:public
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test publication guard
        run: npm test
      - name: Run free simulated Studio regression
        run: npm run test:studio -- --test-concurrency=3
