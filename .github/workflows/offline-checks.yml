name: Offline source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    # The complete, unfiltered suite has exceeded 30 minutes on the Windows
    # runner. Preserve all tests/assertions and their original failed runs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check public source boundary
        run: npm run check:public
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test publication guard
        run: npm test
      - name: Run free simulated Studio regression
        run: npm run test:studio -- --test-concurrency=3

  java-build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install locked fixture dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare project local Java temporary directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path build/java-temp -Force | Out-Null
      - name: Compile, run free Java tests and build the candidate JAR
        working-directory: mod
        env:
          TEMP: ${{ github.workspace }}/build/java-temp
          TMP: ${{ github.workspace }}/build/java-temp
        run: .\gradlew.bat --no-daemon test build
